# Backtest mingguan (§17): walk-forward (fold terbaru) + track record sinyal live, setelah biaya & slippage.
name: Weekly Backtest

on:
  schedule:
    - cron: "0 1 * * 0"      # Minggu 01:00 UTC = 08:00 WIB
  workflow_dispatch:
    inputs:
      folds:
        description: "Jumlah fold validasi terbaru (kosong = config)"
        required: false
        default: ""

concurrency:
  group: market-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  backtest:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      APP_ENV: production
      TZ: Asia/Jakarta
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py health --no-provider
      - name: Backtest
        run: python main.py backtest ${{ inputs.folds && format('--folds {0}', inputs.folds) || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
