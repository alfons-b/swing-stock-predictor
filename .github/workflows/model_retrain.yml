# Retraining terjadwal (§16) + kebijakan promosi (§15). Model baru hanya ACTIVE bila lolos gerbang
# DAN tidak lebih buruk dari model aktif di data yang belum pernah dilihatnya. Bila tidak → REJECTED.
name: Model Retrain

on:
  schedule:
    - cron: "0 23 * * 6"     # Sabtu 23:00 UTC = Minggu 06:00 WIB. Hanya melatih bila model aktif >= retrain_frequency_days.
  workflow_dispatch:
    inputs:
      force:
        description: "Paksa retrain walau model aktif masih baru"
        type: boolean
        default: false

concurrency:
  group: market-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  retrain:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      APP_ENV: production
      TZ: Asia/Jakarta
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
      MODEL_STORAGE: ${{ vars.MODEL_STORAGE || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py health --no-provider
      - name: Ambil data terbaru + cek corporate action semua emiten
        run: python main.py update-data --actions
      - name: Retrain
        run: python main.py train ${{ inputs.force && ' ' || '--if-due' }}
      - name: Daftar versi model
        if: always()
        run: python main.py models | tee -a "$GITHUB_STEP_SUMMARY"
