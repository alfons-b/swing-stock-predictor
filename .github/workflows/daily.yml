# Daily Market Pipeline (§5, §6). Otomatis (schedule) DAN manual (Actions → Daily Market Pipeline → Run workflow).
# Laptop tidak terlibat: job hidup hanya selama run (START → PROCESS → SAVE → EXIT).
name: Daily Market Pipeline

on:
  schedule:
    # GitHub cron selalu UTC. 11:30 UTC = 18:30 WIB (Asia/Jakarta, UTC+7), Senin–Jumat.
    # Ubah di sini (nilai referensi: config/app.yaml → scheduler.daily_cron_utc).
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: "Lewati unduh data (scan ulang dari database)"
        type: boolean
        default: false

concurrency:            # jangan ada dua pipeline yang menulis database bersamaan
  group: market-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  daily:
    needs: tests        # kode yang gagal test tidak dijalankan di production
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_ENV: production
      TZ: Asia/Jakarta
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
      FUNDAMENTAL_API_KEY: ${{ secrets.FUNDAMENTAL_API_KEY }}       # opsional: feed fundamental berlisensi
      FOREIGN_FLOW_API_URL: ${{ secrets.FOREIGN_FLOW_API_URL }}     # opsional: API foreign flow vendor
      FOREIGN_FLOW_API_KEY: ${{ secrets.FOREIGN_FLOW_API_KEY }}
      MODEL_STORAGE: ${{ vars.MODEL_STORAGE || 'auto' }}
      REPORT_STORAGE: ${{ vars.REPORT_STORAGE || 'auto' }}
      PORTFOLIO_VALUE: ${{ vars.PORTFOLIO_VALUE || '100000000' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Health check (database wajib OK)
        run: python main.py health --no-provider
      - name: Daily pipeline
        run: python main.py daily ${{ inputs.skip_ingest && '--skip-ingest' || '' }}
      - name: Ringkasan run
        if: always()
        run: |
          f=$(ls -t reports/daily_report_*.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "Tidak ada report (lihat log)." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report (salinan; sumber utama ada di database/cloud storage)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-report-${{ github.run_id }}
          path: |
            reports/
            data/output/
          retention-days: 30
          if-no-files-found: ignore
