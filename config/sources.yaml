# Provider dicoba berurutan berdasarkan priority; gagal → fallback ke provider berikutnya.
market_data:
  retry:
    attempts: 3
    backoff_seconds: 2           # 2s, 4s, 8s ...
  batch_size: 50
  action_workers: 4              # unduhan corporate action paralel (1 request per emiten di Yahoo)
  providers:
    - name: yahoo_finance
      type: yahoo
      enabled: ${YAHOO_ENABLED:-true}
      priority: 1
      suffix: ".JK"
      index_symbol: "^JKSE"
    - name: idx
      type: idx                  # universe dari situs BEI; harga butuh feed berlisensi (lihat README)
      enabled: false
      priority: 2
      api_key: ${MARKET_DATA_API_KEY:-}
    - name: csv
      type: csv
      enabled: true
      priority: 99
      dir: ${CSV_DATA_DIR:-data/raw/sample}

universe:
  sources: [idx, csv_file]       # idx = endpoint publik BEI (sering diblokir dari datacenter) → fallback file
  # Daftar emiten. Boleh langsung file unduhan idx.co.id → Data Pasar → Daftar Saham (.xlsx atau .csv,
  # kolom: No | Kode | Nama Perusahaan | Tanggal Pencatatan | Saham | Papan Pencatatan) TANPA diubah.
  # Format internal (ticker,name,sector,...) juga diterima. Hanya kolom kode saham yang wajib.
  # Bila file ini tidak ada, dicoba config/universe.xlsx lalu config/universe.csv; terakhir daftar CONTOH
  # config/universe.example.csv (40 emiten, health check: UNIVERSE WARN). File Anda tidak ikut dalam zip update.
  file: config/universe.xlsx
  # Opsional: file sektor terpisah (kolom Kode/ticker + Sektor/sector [+ Subsektor/subsector]).
  # Daftar Saham BEI tidak memuat sektor; tanpa file ini sektor diisi bertahap dari Yahoo (taksonomi Yahoo).
  sectors_file: null
  ticker_changes_file: config/ticker_changes.yaml
  min_ratio_to_deactivate: 0.5   # tolak deaktivasi massal bila daftar baru < 50% jumlah aktif (respons parsial)
